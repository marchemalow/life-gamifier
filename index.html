<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life RPG | Paradigm</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="app-shell">
        <!-- HEADER GLOBAL -->
        <header class="main-header glass">
            <div class="user-profile">
                <div class="avatar-wrapper">
                    <img src="https://api.dicebear.com/7.x/shapes/svg?seed=Felix" alt="Avatar">
                    <div class="lvl-badge">LVL <span id="global-lvl">1</span></div>
                </div>
                <div class="xp-core">
                    <div class="xp-info">
                        <span class="label uppercase bold tracking">Progression Globale</span>
                        <span id="global-xp-text" class="value tech">0%</span>
                    </div>
                    <div class="progress-track">
                        <div id="global-xp-bar" class="progress-fill accent-pink"></div>
                    </div>
                </div>
            </div>

            <div class="sub-levels">
                <div class="sub-card glass" data-cat="academic">
                    <div class="sub-card-header">
                        <i data-lucide="graduation-cap" class="cyan"></i>
                        <span id="lvl-academic">LVL 1</span>
                    </div>
                    <div class="mini-track"><div id="xp-academic" class="fill accent-cyan"></div></div>
                    <label>Academic</label>
                </div>
                <div class="sub-card glass" data-cat="creator">
                    <div class="sub-card-header">
                        <i data-lucide="youtube" class="orange"></i>
                        <span id="lvl-creator">LVL 1</span>
                    </div>
                    <div class="mini-track"><div id="xp-creator" class="fill accent-orange"></div></div>
                    <label>Creator</label>
                </div>
                <div class="sub-card glass" data-cat="copywriter">
                    <div class="sub-card-header">
                        <i data-lucide="pen-tool" class="pink"></i>
                        <span id="lvl-copywriter">LVL 1</span>
                    </div>
                    <div class="mini-track"><div id="xp-copywriter" class="fill accent-pink"></div></div>
                    <label>Copywriter</label>
                </div>
            </div>
        </header>

        <main class="dashboard-content">
            <!-- COLONNE GAUCHE : QUÊTES & PIPELINE -->
            <div class="col-main">
                <section class="card glass">
                    <div class="card-header">
                        <h2><i data-lucide="layout-list"></i> Quêtes Journalières</h2>
                        <button class="btn-add" id="add-quest-btn"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="quest-container" class="quest-list">
                        <!-- Dynamique -->
                    </div>
                    <!-- Formulaire ajout caché par défaut -->
                    <div id="quest-form" class="quest-form hidden">
                        <input type="text" id="quest-input" placeholder="Titre de la quête...">
                        <select id="quest-cat">
                            <option value="academic">Academic</option>
                            <option value="creator">Creator</option>
                            <option value="copywriter">Copywriter</option>
                        </select>
                        <button id="confirm-quest">Ajouter</button>
                    </div>
                </section>

                <section class="card glass">
                    <div class="card-header">
                        <h2><i data-lucide="workflow"></i> Pipeline YouTube</h2>
                    </div>
                    <div class="pipeline-grid">
                        <div class="pipe-col">
                            <label>IDÉE</label>
                            <div contenteditable="true" class="editable-area" id="pipe-idea">...</div>
                        </div>
                        <div class="pipe-col">
                            <label>SCRIPT & REC</label>
                            <div contenteditable="true" class="editable-area" id="pipe-script">...</div>
                        </div>
                        <div class="pipe-col">
                            <label>MONTAGE & UP</label>
                            <div contenteditable="true" class="editable-area" id="pipe-upload">...</div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- COLONNE DROITE : STAMINA & LOOT -->
            <div class="col-side">
                <section class="card glass status-card">
                    <div class="card-header"><h2><i data-lucide="zap"></i> Stamina</h2></div>
                    <div class="stamina-visual">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="stamina-circle" class="circle accent-orange" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="stamina-val"><span id="stamina-num">100</span>%</div>
                    </div>
                </section>

                <section class="card glass loot-card">
                    <div class="card-header"><h2><i data-lucide="gem"></i> Trésor</h2></div>
                    <div class="treasure-display">
                        <div class="counter-group">
                            <button onclick="updateMoney(-10)">-</button>
                            <span id="money-count" class="money-text">0</span><span class="currency">€</span>
                            <button onclick="updateMoney(10)">+</button>
                        </div>
                        <div class="loot-goal">
                            <label>Objectif : <span contenteditable="true" id="goal-name">Sony ZV-E10</span></label>
                            <div class="progress-track mini">
                                <div id="money-bar" class="progress-fill accent-cyan"></div>
                            </div>
                            <span class="goal-price"><span id="goal-val">1200</span>€</span>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
